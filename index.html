<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05121E" />
    <meta
      name="description"
      content="ContextShield — Privacy-first hybrid AI cybersecurity defense console with local PII masking, deterministic threat rules, and consent-gated cloud analysis."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ContextShield – Privacy-First Hybrid AI Security Assistant" />

      property="og:description"
      content="Screen suspicious messages and links with local PII redaction, deterministic security rules, and consent-gated AI analysis."
    />
    <title>ContextShield – Privacy-First Hybrid AI Security Assistant</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('cs_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
